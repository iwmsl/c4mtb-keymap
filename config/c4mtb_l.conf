CONFIG_ZMK_BATTERY_REPORTING=y

# ZMK_USBは`depends on (!ZMK_SPLIT || ZMK_SPLIT_ROLE_CENTRAL)`のため、peripheralの
# 左手では元から選択不能。ただしZMKのseeeduino_xiao_ble.confが=yを入れてくるので、
# ここで明示的にnへ落とさないと依存不成立のKconfig警告が毎ビルド出る。省電力効果はない。
CONFIG_ZMK_USB=n

# 2M PHYを切る。PHYは左右のネゴシエーションで決まるので、片方が対応していなければ
# リンクは1Mのままになる。右手側だけでも結果は同じだが、左手も左右リンクの当事者
# なので両方に明示する。理由と根拠はconfig/c4mtb_r.confの同じ行のコメントに書いた。
CONFIG_BT_CTLR_PHY_2M=n

# 接続パラメータは中央(右手)がbt_conn_le_create()で決める。左手は
# BT_GAP_AUTO_UPDATE_CONN_PARAMS=n(ZMKがperipheral向けに設定)なので更新要求を
# 出さない。よってsupervision timeoutは右手のCONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT側
# だけを触ればよく、ここに BT_PERIPHERAL_PREF_TIMEOUT を書いても効かない。

# DYA Studioのsplit RPCをcentralが中継できるよう、peripheral側もevent relayを有効化する。
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SETTINGS_RPC=y
