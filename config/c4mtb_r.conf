CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_PMW3610=y
# Measured c4mtb/COROPIT orientation; DYA Studio can override this at runtime.
CONFIG_PMW3610_INVERT_X=y

# ---------------------------------------------------------------------------
# 高解像度スクロール(HID Resolution Multiplier)
#
# 無効だとホストへ送れるホイールの最小単位が1ノッチ(ブラウザで約3行、
# Ctrl+ホイールならズーム1段まるごと)になる。cpi=400・φ25mm球では
# 15.75カウント/mm、overlayのscalerが8カウント=1ノッチだったので、球を
# 0.51mm転がすと1ノッチ飛ぶ計算になり、指で出せる最小移動量が既に1ノッチ
# 相当だった。ファーム側で何を調整しても1ノッチ未満は表現できないので、
# 「細かいスクロール/ズームができない」の主因はここ。
#
# 有効にすると内部のホイール単位が1/16ノッチになり、最小ステップは
# ブラウザで6px程度まで下がる。単位が1/16になる分ゲインを16倍し直す必要が
# あり、次の2つは必ずセットで変える(片方だけだと1/16の速度になる)。
#   - boards/shields/c4mtb/c4mtb_r.overlay: zip_scroll_scaler 1 8 → 2 1
#   - config/c4mtb.keymap: &msc MOVE_Y(5) → MOVE_Y(80)
#     (&mscの引数は単位/秒。1ノッチ=16単位なので5ノッチ/秒は80になる)
#
# 注意1: HIDディスクリプタが変わる。BLEホストは古い記述を持ったままだと
# 拾わないので、有効化後は各ホストでペアリングを削除して再登録する
# (ZMK docs: features/pointing.md「Refreshing the HID descriptor」)。
#
# 注意2: ZMKは倍率をホストからのフィーチャレポートで受け取るが、既定値が
# 15(=16倍)で、ホストが何も書いてこない場合も「相手は16倍解像度を理解して
# いる」と仮定して送る。Windows/Linuxは最大値を書き込むので問題ないが、
# 書き込まないホストに繋ぐと16倍速になる。症状は「スクロールが異様に速い」で
# すぐ分かる。その場合はこの行を消して上のscaler/MOVE_Yも元へ戻す。
#
# 注意3: 注意2の保険としてZMK側にホスト倍率に応じた除算があるが、v0.3/main
# 共に app/src/pointing/input_listener.c の apply_resolution_scaling() が
# 商ではなく元値を代入している(evt->value = val)。既定の倍率15では除数が1に
# なりこの経路を通らないため実害はないが、倍率を低く設定してくるホストでは
# 効かない。上流が直るまでは注意2の実機確認が唯一の判定手段。
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# ---------------------------------------------------------------------------
# PMW3610 / COROPIT の追従調整
#
# ドライバはcormoran/zmk-driver-pmw3610-with-custom-studio-rpc。roBa/moNa2のsayu-hub版
# とは調整箇所が違う。CPI・取り付け向き・force-awakeはKconfigではなく
# devicetree側(boards/shields/c4mtb/c4mtb_r.overlay)にある。
# moNa2の.confにある CONFIG_PMW3610_CPI / ORIENTATION_180 / POLLING_RATE_125 /
# AUTOMOUSE_TIMEOUT_MS / MOVEMENT_THRESHOLD / SCROLL_TICK はこのドライバには
# 存在しないので、貼っても黙って無視される。
#
# 触る順番:
#   動かしている最中が重い/飛ぶ → REPORT_INTERVAL_MIN → RUN_DOWNSHIFT
#   放置後の初動だけ遅い        → ZMK_IDLE_TIMEOUT → REST*_SAMPLE_TIME_MS
#   ときどき秒単位で効かない    → 下の「BLEリンクの切断検出と復帰」
# ---------------------------------------------------------------------------

# レポートの最小間隔(ms)。0はデータレディ割込みごとに毎回送信する設定で、
# DYA対応ドライバはforce-awake中のRUNサンプリングが4msなので、
# つまり0のままだと約250Hzを送り続ける。BLEの接続間隔は7.5-15msなので
# リンクが運びきれず、キューが詰まって「遅れて一気に動く」挙動になる。
# 12にすると3サンプル分を合算して約80Hzで送る。移動量は加算されるので
# 情報は落ちない。USB専用運用なら8まで下げると最も鋭くなる。
CONFIG_PMW3610_REPORT_INTERVAL_MIN=12

# RUNからREST1へ落ちるまでの無操作時間(ms)。ドライバ既定は128で、少し手を
# 止めるたびにREST1(サンプリング40ms)へ落ちるため、動かし始めが一拍遅れて
# から飛ぶ。roBa/moNa2と同じ最大値へ上げる。devicetreeのforce-awakeが
# 効いている間はそもそも落ちないので、これはIDLE復帰直後の保険。
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264

# REST1のサンプリング周期(ms)。既定40、roBa/moNa2は20。REST1から復帰する
# ときの初動が軽くなる。
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20

# 表面追従の補正。既定y、roBa/moNa2も有効。
CONFIG_PMW3610_SMART_ALGORITHM=y

# --- 放置からの復帰(ボールだけ遅くなる理由) ------------------------------
# ZMKがIDLEへ落ちるとforce-awakeが解除され、センサーはRUN→REST1→REST2→REST3と
# 段階的に眠る。ここに構造的な閉じた輪がある。
#
#   1. IDLE中、ZMKをACTIVEへ戻せるのはinputイベントだけ
#      (activity.cのINPUT_CALLBACK_DEFINE)
#   2. 右手のinputソースはボールだけ
#   3. force-awakeが戻るのはACTIVEになってから(ドライバのon_activity_state)
#   → つまり「復帰の最初の一手」は必ず"今のRESTサンプリング周期"で拾わせるしかなく、
#     しかもその1サンプル内で12bitデルタが非ゼロにならないとinputイベントが出ない。
#
# ゆっくり/小さく動かすとそのサンプルが0カウントになり、inputイベントが出ない →
# ZMKはIDLEのまま → センサーはREST3のまま、という自己維持する足踏みになる。
# これが「体感で秒単位」の正体。キーはGPIO割り込みで即座にIDLEタイマーを
# リセットするので影響を受けない。だから症状が"ボールだけ"に出る。
# USB/BLEのどちらで繋いでいても同じ(activity.cのIDLE判定は電源を見ていない)。
#
# 対策はRESTの階段を浅くして、IDLE中でも短い周期で拾わせること。
#   1. IDLEまでの時間を延ばしてforce-awake(4ms)を保つ時間を稼ぐ
#   2. 最深サンプリングを浅くする(500ms→100ms→現在20ms)
#   3. 深い段へ落ちるまでの時間を延ばす
# 最悪待ちは500ms→20msになり、足踏みから抜けるチャンスも単位時間あたり5倍。
# 代償はIDLE中の待機電流だけで、操作中の電池消費は変わらない。

# 最終入力からIDLEまで(ms)。ZMK既定30秒。ボール操作もこのタイマーを
# リセットする(ZMK_POINTING有効時はactivity.cがinputイベントを購読)ので、
# 2分あれば読み物中の手止まりはRUN(4ms)のまま通せる。
#
# 上の足踏みを完全に消したいなら、ここを十分大きくして事実上IDLEへ落ちない
# ようにするのが決定打(有線運用なら電池を気にしなくてよい)。ただしZMKは
# 電源に応じてこの値を変えないので、無線に戻したときの消費も一緒に増える。
CONFIG_ZMK_IDLE_TIMEOUT=120000

# REST1/REST2/REST3のサンプリング周期(ms)。既定40 / 100 / 500。10ms刻み、上限2550。
# 3段すべて20msへそろえ、どこまで眠っても初動が20msで拾われるようにする。
CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=20
CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=20

# 次の段へ落ちるまでの時間(ms)。既定5000 / 17000。
# 下限はREST1が16×REST1_SAMPLE、REST2が128×REST2_SAMPLE。REST2_SAMPLEを
# 40→20へ下げたのでREST2側の下限は5120→2560msへ動くが、どちらも範囲内。
# ドライバはmintimeで割った整数をレジスタへ入れるので実効値は
# REST1が93×320=29760ms、REST2が23×2560=58880msになる。
CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=30000
CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=60000

# 起動時に "Incorrect product id 0xFF" が出る場合だけ延ばす。
# CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=300

# 切り分け用。USB接続 + ZMK Studio用UARTでドライバログが読める。
# CONFIG_PMW3610_LOG_LEVEL_DBG=y

# 使用中にカーソルだけ永久停止する問題はREST調整とは別。
# patches/pmw3610-recovery.patchとfirmware/README.mdを参照。

# --- BLEリンクの切断検出と復帰 ---------------------------------------------
# 「放置後の初動が遅い」のうち、センサー側は上のREST調整で最悪100msまで詰めた。
# それでも体感で秒単位に感じる分は、リンクが一度落ちて張り直している時間しか
# 残っていない。DYA基盤(cormoran/main+dya / Zephyr 4.1)での内訳は次のとおり。
#
#   1. 切断の検出     supervision timeout = 4000ms  ← ここが支配的
#   2. 再アドバタイズ  100-150ms(bond済みならdirected adv。高dutyの1.28秒が
#                     切れてlow dutyへ落ちても間隔は同じ100-150ms)
#   3. スキャンで発見  60ms間隔 / 30msウィンドウ
#   4. 暗号化 + GATT再discovery(ZMKは切断時に
#      release_peripheral_slot()でハンドルを捨てるので毎回走る)
#
# 2-4は合わせても1秒に届かない。「落ちたことに4秒気付かない」が待ち時間の
# 大半なので、supervision timeoutを詰める方向で直す。
# Zephyrの制約は BT_PERIPHERAL_PREF_TIMEOUT のhelpにあるとおり
#   timeout_ms > (1 + latency) * interval_max_ms * 2
# で、これを割ると接続パラメータ自体が弾かれる(bt_le_conn_params_valid)。

# 右手↔左手。ZMK既定400(4秒)→100(1秒)。
# この linkは interval=6(7.5ms) / latency=30 なので下限は465ms。1000msで約2.1倍。
# 左右間は両端ともこのファームなので、値が確定していて詰めやすい。
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=100

# 右手↔ホスト。ZMK既定400(4秒)→200(2秒)。
# interval_max=12(15ms) / latency=30 で下限930ms。2000msで同じく約2.1倍。
# ホストがスリープから戻ったとき、右手がまだ「繋がっている」と思っている間は
# アドバタイズを始めないので、この4秒がそのまま復帰の待ち時間になっていた。
# 接続間隔を最終的に決めるのはホスト側なので、左右間より余裕を残す。
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=200

# 2M PHYを切って、そもそも落ちる頻度を下げる。ZMKの
# CONFIG_ZMK_BLE_EXPERIMENTAL_CONN が現状これだけを行う設定で、公式には
# 「将来の既定にする予定の接続安定化」と説明されている。ZMK_SPLIT_BLEは
# BT_AUTO_PHY_UPDATEをselectするため、放っておくと左右間もホスト間も2Mへ上がる。
# 2Mは受信感度が数dB落ちる=手やケースで遮られたときに切れやすい。こちらの
# データ量は1Mで足りるので感度を取る。EXPERIMENTAL_CONNは将来中身が増える
# 可能性があるので、対象を明示して書く。
CONFIG_BT_CTLR_PHY_2M=n

# LATENCYは下げない。Zephyrのコントローラは送信データを積んだ時点で
# ull_periph_latency_cancel()でlatencyを打ち切るので、latency=30のままでも
# キーやボールの送信が遅れることはない。下げても速くならず電池だけ減る。
# CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
# CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# DYA StudioのRPC群は通常版だけにc4mtb-dya-studio snippetから追加する。
# テレメトリ読出し版はUSB serialを専有するため、同じsnippetを使わない。

# Privacy-preserving cumulative counters are stored only on the BLE central.
# See firmware/telemetry.md and docs/decisions/0017-privacy-preserving-telemetry.md.
CONFIG_C4MTB_TELEMETRY=y
CONFIG_C4MTB_TELEMETRY_SAVE_INTERVAL_MINUTES=30
